[project]
name = "ai-trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
